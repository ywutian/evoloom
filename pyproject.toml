[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evoloom"
version = "0.3.0"
description = "A local, extensible coding-agent harness with tools, memory, skills, and MCP support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "agent-client-protocol>=0.12,<1",
  "anthropic>=0.49,<3",
  "openai>=1.68,<4",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<16",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
evoloom = "agents.main:main"
evoloom-acp = "agents.acp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["ASYNC240", "ASYNC250", "B023", "E402", "E501", "E741"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bear-code"
version = "0.1.0"
description = "A local, extensible coding-agent harness with tools, memory, skills, and MCP support."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=0.49,<1",
  "openai>=1.68,<2",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
bear-code = "agents.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["ASYNC240", "ASYNC250", "B023", "E402", "E501", "E741"]

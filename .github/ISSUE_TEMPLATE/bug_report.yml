name: Bug report
description: Report a reproducible EvoLoom defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials here. Use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: EvoLoom version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI runtime
        - ACP adapter
        - Public gateway
        - Agent Canvas UI
        - Benchmark runner
        - Deployment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal example with secrets and private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true

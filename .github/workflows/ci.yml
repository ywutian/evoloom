name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check agents benchmarks tests scripts
      - run: uv run pytest --cov=agents --cov-report=term-missing --cov-report=xml --cov-fail-under=15
      - run: uv run python scripts/quality_report.py --check

  public-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check scripts/public-gateway.mjs
      - run: node --test tests/test_public_gateway.mjs
      - run: bash -n scripts/cloudrun-entrypoint.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: evoloom:ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cloudrun
          push: false
          tags: evoloom-cloudrun:ci
